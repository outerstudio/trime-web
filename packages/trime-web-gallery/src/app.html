<!doctype html>
<html lang="cmn-Hant-CN">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <meta name="viewport" content="width=device-width" />
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem("modeUserPrefers");
                    var light;
                    if (raw == null) {
                        light = window.matchMedia("(prefers-color-scheme: light)").matches;
                    } else {
                        light = JSON.parse(raw);
                        if (typeof light !== "boolean") {
                            light = window.matchMedia("(prefers-color-scheme: light)").matches;
                        }
                    }
                    document.documentElement.classList.toggle("dark", !light);
                } catch (e) {
                    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                        document.documentElement.classList.add("dark");
                    }
                }
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400&family=Noto+Sans+TC:wght@400&family=Roboto:wght@400&display=swap"
            rel="stylesheet"
        />
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" data-theme="wintry">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
