<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="同文鍵盤主題工具與主題列表">
<title>Trime web</title>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5Q5WY95LB5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5Q5WY95LB5');
</script>
<style>
  :root {
    --bg0: #f3f0ea;
    --bg1: #e8e2d8;
    --ink: #1c1915;
    --muted: #5c564c;
    --card: rgba(255, 255, 255, 0.72);
    --stroke: rgba(28, 25, 21, 0.12);
    --accent: #2f6b4a;
    --accent-ink: #f7fff9;
    --shadow: 0 18px 50px rgba(28, 25, 21, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg0: #12151a;
      --bg1: #1a1f27;
      --ink: #eef1f5;
      --muted: #9aa3af;
      --card: rgba(28, 33, 42, 0.88);
      --stroke: rgba(238, 241, 245, 0.12);
      --accent: #5ecf8e;
      --accent-ink: #0d1511;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans TC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(47, 107, 74, 0.18), transparent 55%),
      radial-gradient(700px 420px at 100% 0%, rgba(74, 144, 217, 0.14), transparent 50%),
      linear-gradient(165deg, var(--bg0), var(--bg1));
  }
  .wrap {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem 3rem;
  }
  .panel {
    width: min(100%, 40rem);
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 0 0 0.35rem;
  }
  .brand-mark {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.55rem;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: var(--bg0);
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .brand-mark svg { width: 1.75rem; height: 1.75rem; display: block; }
  .brand-mark .dot { fill: var(--accent); }
  .brand {
    font-size: clamp(1.75rem, 4vw, 2.35rem);
    font-weight: 750;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .ask {
    margin: 0 0 1.75rem;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .choices {
    display: grid;
    gap: 0.85rem;
  }
  @media (min-width: 560px) {
    .choices { grid-template-columns: 1fr 1fr; }
  }
  a.choice {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 1.15rem 1.2rem 1.25rem;
    border-radius: 1rem;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  a.choice:hover,
  a.choice:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
    outline: none;
  }
  a.choice .label {
    font-weight: 700;
    font-size: 1.1rem;
  }
  a.choice .desc {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  a.choice .go {
    margin-top: 0.55rem;
    align-self: flex-start;
    font-size: 0.85rem;
    font-weight: 650;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
  }
  .foot {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .foot a { color: inherit; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="wrap">
    <div class="panel">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2.5" y="5.5" width="19" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 9.2h10M7 12h4.2M13.2 12H17M9.5 14.8h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle class="dot" cx="18.2" cy="14.8" r="1.15"/>
          </svg>
        </span>
        <h1 class="brand">Trime Web</h1>
      </div>
      <p class="ask">你想做什麼？</p>
      <div class="choices">
        <a class="choice" href="/tool/">
          <span class="label">設計主題</span>
          <span class="desc">製作自己的主題，用編輯器調整配色、鍵盤與樣式</span>
          <span class="go">打開編輯器</span>
        </a>
        <a class="choice" href="/gallery/">
          <span class="label">瀏覽主題列表</span>
          <span class="desc">瀏覽和下載別人分享的主題，也可以導入到編輯器做修改</span>
          <span class="go">打開主題列表</span>
        </a>
      </div>
      <p class="foot">
        <a href="https://github.com/outerstudio/trime-web">Trime-web</a>
      </p>
    </div>
  </main>
</body>
</html>
