config_version: "3.0"
name: Sample Dark
author: Trime Web
description: Gallery fixture：深色配色 × 主鍵盤／符號鍵盤
style:
  keyboard_height: 180
  keyboard_height_land: 140
  key_height: 36
  key_width: 10
  horizontal_gap: 3
  vertical_gap: 5
  round_corner: 8
  candidate_view_height: 28
  candidate_padding: 5
  key_text_size: 18
  key_long_text_size: 14
  symbol_text_size: 10
  enter_labels:
    default: Enter
    done: 完成
    go: 前往
    next: 下個
    pre: 上個
    search: 搜尋
    send: 發送
fallback_colors:
  candidate_text_color: text_color
preset_color_schemes:
  night:
    name: Night
    author: Trime Web
    back_color: 0x1a1d23
    border_color: 0x2a3038
    text_color: 0xe8eaed
    text_back_color: 0x252a32
    candidate_text_color: 0xe8eaed
    comment_text_color: 0x8b949e
    label_color: 0x8b949e
    hilited_text_color: 0xffffff
    hilited_back_color: 0x3d4450
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0x4a90d9
    hilited_comment_text_color: 0xd0d7de
    hilited_label_color: 0xffffff
    key_text_color: 0xe8eaed
    key_back_color: 0x2d333b
    key_symbol_color: 0x8b949e
    keyboard_back_color: 0x1a1d23
    hilited_key_text_color: 0xffffff
    hilited_key_back_color: 0x4a90d9
    hilited_key_symbol_color: 0xffffff
    off_key_back_color: 0x3d4450
    off_key_text_color: 0xe8eaed
    on_key_back_color: 0x4a90d9
    on_key_text_color: 0xffffff
  dusk:
    name: Dusk
    author: Trime Web
    back_color: 0x2b1d2e
    border_color: 0x3d2a42
    text_color: 0xf5e6ff
    text_back_color: 0x352338
    candidate_text_color: 0xf5e6ff
    comment_text_color: 0xb89bc4
    label_color: 0xb89bc4
    hilited_text_color: 0xffffff
    hilited_back_color: 0x4a3450
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0xc77dff
    hilited_comment_text_color: 0xf0d5ff
    hilited_label_color: 0xffffff
    key_text_color: 0xf5e6ff
    key_back_color: 0x3d2a42
    key_symbol_color: 0xb89bc4
    keyboard_back_color: 0x2b1d2e
    hilited_key_text_color: 0xffffff
    hilited_key_back_color: 0xc77dff
    hilited_key_symbol_color: 0xffffff
    off_key_back_color: 0x4a3450
    off_key_text_color: 0xf5e6ff
    on_key_back_color: 0xc77dff
    on_key_text_color: 0xffffff
preset_keys:
  Return:
    label: enter_labels
    send: Return
  BackSpace:
    label: ⌫
    send: BackSpace
  Switch_symbols:
    label: 符
    send: Eisu_toggle
    select: symbols
  Go_main:
    label: 返
    send: Eisu_toggle
    select: main
  space:
    label: 空格
    send: space
preset_keyboards:
  main:
    name: 中文
    ascii_mode: 0
    width: 10
    height: 36
    keyboard_height: 180
    keyboard_height_land: 140
    columns: 10
    keys:
      - { click: q, long_click: "1" }
      - { click: w, long_click: "2" }
      - { click: e, long_click: "3" }
      - { click: r, long_click: "4" }
      - { click: t, long_click: "5" }
      - { click: y, long_click: "6" }
      - { click: u, long_click: "7" }
      - { click: i, long_click: "8" }
      - { click: o, long_click: "9" }
      - { click: p, long_click: "0" }
      - { width: 5 }
      - { click: a }
      - { click: s }
      - { click: d }
      - { click: f }
      - { click: g }
      - { click: h }
      - { click: j }
      - { click: k }
      - { click: l }
      - { width: 5 }
      - { click: Switch_symbols, width: 15, label: 符 }
      - { click: z }
      - { click: x }
      - { click: c }
      - { click: v }
      - { click: b }
      - { click: n }
      - { click: m }
      - { click: BackSpace, width: 15, label: ⌫ }
      - { click: Switch_symbols, width: 15, label: 符 }
      - { click: ",", width: 10 }
      - { click: space, width: 50, label: 空格 }
      - { click: ".", width: 10 }
      - { click: Return, width: 15 }
  symbols:
    name: 符號
    ascii_mode: 1
    reset_ascii_mode: true
    width: 10
    height: 36
    keyboard_height: 180
    keyboard_height_land: 140
    columns: 10
    keys:
      - { click: "1" }
      - { click: "2" }
      - { click: "3" }
      - { click: "4" }
      - { click: "5" }
      - { click: "6" }
      - { click: "7" }
      - { click: "8" }
      - { click: "9" }
      - { click: "0" }
      - { click: "@" }
      - { click: "#" }
      - { click: "$" }
      - { click: "%" }
      - { click: "&" }
      - { click: "*" }
      - { click: "-" }
      - { click: "+" }
      - { click: "(" }
      - { click: ")" }
      - { click: "!" }
      - { click: '"' }
      - { click: "'" }
      - { click: ":" }
      - { click: ";" }
      - { click: "/" }
      - { click: "?" }
      - { click: "~" }
      - { click: BackSpace, width: 20, label: ⌫ }
      - { click: Go_main, width: 20, label: 返 }
      - { click: space, width: 45, label: 空格 }
      - { click: Return, width: 15 }
